
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Students</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard">

    <h1>Registered Students</h1>

    <table>
        <thead>
            <tr>
                <th>Roll Number</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Semester</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.roll_number }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.department }}</td>
                <td>{{ student.semester }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No students registered yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('add_student') }}">➕ Add Student</a>
    <br><br>
    <a href="{{ url_for('admin_dashboard') }}">← Back to Dashboard</a>

</div>

</body>
</html>
